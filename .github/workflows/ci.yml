name: Java CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: outputs/apartment-search
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: outputs/apartment-search/pom.xml
      - name: Test collection resume orchestration
        run: python3 scripts/test_collect_nationwide.py
      - name: Test map behavior without external API
        run: node scripts/test-detail-map.cjs
      - name: Build and test without public API credentials
        run: sh ./mvnw -B -ntp -Ppostgres-it clean verify
      - name: Build and start container stack with an empty database
        env:
          DB_PASSWORD: disposable-ci-database
          PORT: '8082'
        run: docker compose up -d --build --wait app
      - name: Verify container search and restart persistence
        env:
          DB_PASSWORD: disposable-ci-database
          PORT: '8082'
        run: |
          curl --fail --silent http://127.0.0.1:8082/api/trades | python3 -c 'import json,sys; assert json.load(sys.stdin)["total"] == 0'
          docker compose exec -T db psql -U apartments -d apartments -c "INSERT INTO trade(region,district,apartment,address,area,floor,built_year,deal_date,price,source) VALUES ('서울','검증구','CI fixture','CI address',84,1,2020,'2026-09-01',10000,'TEST');"
          docker compose restart app
          docker compose up -d --wait app
          curl --fail --silent http://127.0.0.1:8082/api/trades | python3 -c 'import json,sys; assert json.load(sys.stdin)["total"] == 1'
      - name: Stop disposable CI stack
        if: always()
        env:
          DB_PASSWORD: disposable-ci-database
        run: docker compose down --volumes
