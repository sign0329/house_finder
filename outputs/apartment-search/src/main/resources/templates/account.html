<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 계정 · 집결</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/account.css"></head><body><header th:replace="~{fragments :: header('account')}"></header><main class="account-shell"><div class="account-intro"><span class="account-eyebrow">MY ACCOUNT</span><h1><span th:text="${profile.nickname}">사용자</span>님,<br>환영합니다.</h1><p>계정 정보를 확인하고<br>원하는 지역의 거래를 살펴보세요.</p><a href="/">실거래가 탐색 →</a></div><section class="account-card"><h2>내 계정</h2><dl><dt>아이디</dt><dd th:text="${profile.username}"></dd><dt>닉네임</dt><dd th:text="${profile.nickname}"></dd><dt>가입일 (서버 시간)</dt><dd th:text="${#temporals.format(profile.createdAt, 'yyyy-MM-dd HH:mm')}"></dd></dl><p class="account-help">관심 아파트는 계정에 저장됩니다. 다른 기기에서도 로그인해 확인할 수 있습니다.</p><form method="post" th:action="@{/logout}"><button class="account-submit">로그아웃</button></form></section></main></body></html>
