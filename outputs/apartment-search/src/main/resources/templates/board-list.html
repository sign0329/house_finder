<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('게시판')}"></th:block><link rel="stylesheet" href="/css/board.css"></head>
<body><header th:replace="~{fragments :: header('board')}"></header><main id="main-content" class="board-shell">
<div class="board-heading"><div><p>MEMBERS COMMUNITY</p><h1>게시판</h1><p>집과 동네에 관한 이야기를 나눠보세요. 로그인한 회원만 볼 수 있습니다.</p></div><a class="board-button" href="/board/new">글쓰기</a></div>
<form class="board-card board-form" method="get" action="/board">
<label for="board-category">분류</label><select id="board-category" name="category"><option value="ALL" th:selected="${category=='ALL'}">전체</option><option value="QUESTION" th:selected="${category=='QUESTION'}">질문</option><option value="INFO" th:selected="${category=='INFO'}">정보</option><option value="FREE" th:selected="${category=='FREE'}">자유</option></select>
<label for="board-scope">검색 범위</label><select id="board-scope" name="scope"><option value="ALL" th:selected="${scope=='ALL'}">제목 + 내용</option><option value="TITLE" th:selected="${scope=='TITLE'}">제목</option><option value="BODY" th:selected="${scope=='BODY'}">내용</option></select>
<label for="board-query">검색어</label><input id="board-query" name="q" maxlength="100" th:value="${q}" placeholder="검색어를 입력하세요"><div class="board-actions"><button class="board-button" type="submit">검색</button><a href="/board">조건 초기화</a></div>
</form><section class="board-card" aria-label="게시글 목록"><p th:if="${#lists.isEmpty(posts)}">조건에 맞는 게시글이 없습니다. 검색어·분류를 바꾸거나 첫 글을 작성해보세요.</p>
<article class="board-row" th:each="post : ${posts}"><h2><span class="board-category" th:text="${post.category=='QUESTION'?'질문':(post.category=='INFO'?'정보':'자유')}"></span> <a th:href="@{/board/{id}(id=${post.id})}" th:text="${post.title}">제목</a></h2><p><span th:text="${post.nickname}">작성자</span> · <time th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}"></time></p></article>
</section><nav class="board-actions" aria-label="게시판 페이지"><a th:if="${page>0}" th:href="@{/board(page=${page-1},q=${q},category=${category},scope=${scope})}">이전</a><span th:text="${page+1}+' 페이지'"></span><a th:if="${hasNext}" th:href="@{/board(page=${page+1},q=${q},category=${category},scope=${scope})}">다음</a></nav>
</main></body></html>
