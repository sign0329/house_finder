<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 집결</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/account.css"></head><body><header th:replace="~{fragments :: header('account')}"></header><main class="account-shell"><div class="account-intro"><span class="account-eyebrow">WELCOME BACK</span><h1>다시 만나 반가워요.</h1><p>집결 계정으로 로그인하고<br>실거래가 탐색을 이어가세요.</p><a href="/">로그인 없이 실거래가 둘러보기 →</a></div><section class="account-card"><h2>로그인</h2><p class="account-alert" role="alert" th:if="${param.error}">아이디 또는 비밀번호를 확인하세요.</p><p class="account-success" role="status" th:if="${param.registered}">회원가입이 완료됐습니다. 로그인해주세요.</p><p class="account-success" role="status" th:if="${param.logout}">로그아웃했습니다.</p><form method="post" th:action="@{/login}"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="30" placeholder="가입한 아이디"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72" placeholder="비밀번호 입력"><button class="account-submit">로그인</button></form><p class="account-bottom">아직 계정이 없나요? <a href="/signup">회원가입</a></p></section></main></body></html>
