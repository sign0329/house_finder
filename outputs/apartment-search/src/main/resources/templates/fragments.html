<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="bookmark-user" th:content="${bookmarkUser}"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' · 집결'">집결</title>
<link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"><script defer th:src="@{/js/app.js}" src="/js/app.js"></script></head>
<body><header th:fragment="header(active)" class="header" data-dataset="molit"><a class="brand" href="/"><span class="brand-icon">집</span>집결<span class="brand-sub">살 곳을 알아가는 기준</span></a><nav aria-label="주요 메뉴"><a href="/" th:classappend="${active=='search'} ? 'active'">실거래가 탐색</a><a href="/saved" th:classappend="${active=='saved'} ? 'active'">관심 아파트 <span id="saved-count" class="count">0</span></a><a href="/login" th:if="${!userSignedIn and !adminSignedIn}">로그인</a><a href="/account" th:if="${userSignedIn}">내 계정</a><a href="/admin" th:if="${adminSignedIn}">관리자</a><form class="nav-logout" th:if="${userSignedIn}" method="post" th:action="@{/logout}"><button>로그아웃</button></form></nav><span class="mode" >PUBLIC DATA</span></header>
<footer th:fragment="footer" class="footer"><span><b>집결</b> &nbsp; 집을 고르는 일, 데이터에서 시작하세요.</span><span th:text="${dataNotice}">실거래 데이터 탐색</span></footer></body></html>
