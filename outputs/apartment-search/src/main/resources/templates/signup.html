<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 · 집결</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/account.css"></head><body><header th:replace="~{fragments :: header('account')}"></header><main class="account-shell"><div class="account-intro"><span class="account-eyebrow">JOIN HOUSE FINDER</span><h1>집을 알아가는<br>첫걸음.</h1><p>아이디와 닉네임으로<br>나만의 집결 계정을 만드세요.</p><a href="/login">이미 계정이 있다면 로그인 →</a></div><section class="account-card"><h2>회원가입</h2><p class="account-alert" role="alert" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/signup}"><label for="username">아이디</label><input id="username" name="username" th:value="${username}" autocomplete="username" required pattern="[a-z0-9_]{4,30}" minlength="4" maxlength="30" placeholder="영문 소문자·숫자·밑줄 4~30자"><label for="nickname">닉네임</label><input id="nickname" name="nickname" th:value="${nickname}" autocomplete="nickname" required minlength="2" maxlength="30" placeholder="2~30자"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="72" placeholder="12자 이상"><p class="account-help">한글 등 다중 바이트 문자를 포함하면 최대 72바이트까지 입력할 수 있습니다.</p><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="72" placeholder="비밀번호를 다시 입력하세요"><button class="account-submit">가입하기</button></form></section></main></body></html>
