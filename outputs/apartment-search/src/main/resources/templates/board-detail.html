<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('회원 게시판')}"></th:block><link rel="stylesheet" href="/css/board.css"></head>
<body><header th:replace="~{fragments :: header('board')}"></header><main id="main-content" class="board-shell">
<a href="/board">← 게시판 목록</a><article class="board-card"><h1 th:text="${post.title}">제목</h1><p><span th:text="${post.nickname}"></span> · <time th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}"></time></p><p class="board-body" th:text="${post.body}"></p></article>
<div class="board-actions" th:if="${owner}"><a class="board-button" th:href="@{/board/{id}/edit(id=${post.id})}">수정</a><details><summary>글 삭제</summary><p>삭제하면 되돌릴 수 없습니다.</p><form method="post" th:action="@{/board/{id}/delete(id=${post.id})}"><button class="board-button" type="submit">삭제 확인</button></form></details></div>
</main></body></html>
