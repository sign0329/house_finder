<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('거래 상세')}"></head><body><div th:replace="~{fragments :: header('search')}"></div><main class="shell detail"><a class="back" href="/">← 실거래가 탐색</a><div class="detail-heading"><div><span class="eyebrow">거래 상세</span><h1 th:text="${trade.apartment}"></h1><p th:text="${trade.address.startsWith(trade.region+' ') ? trade.address : trade.region+' '+trade.address}"></p></div><button class="bookmark big" th:if="${userSignedIn}" th:attr="data-key=${trade.key()},data-id=${trade.id},data-name=${trade.apartment},data-location=${trade.region+' '+trade.district}" aria-label="관심 아파트 등록" aria-pressed="false">☆</button><a class="bookmark-login" th:unless="${userSignedIn}" href="/login" aria-label="로그인 후 관심 아파트 등록" title="로그인 후 관심 아파트 등록">☆</a></div>
<section class="metrics"><div><span>거래금액</span><strong th:text="${trade.priceLabel()}"></strong></div><div><span>전용면적</span><strong th:text="${trade.area+'㎡'}"></strong></div><div><span>거래 층 / 건축연도</span><strong th:text="${trade.floor+'층 / '+trade.builtYear+'년'}"></strong></div><div><span>계약일</span><strong th:text="${trade.dealDate}"></strong></div></section>
<section class="chart-card" id="apartment-map" th:attr="data-map-key=${#strings.isEmpty(mapKey) ? null : mapKey},data-address=${trade.address}">
<h2>아파트 위치</h2><p th:text="${trade.address}"></p>
<p class="small-note">공공데이터 주소를 검색한 위치로 실제 출입구와 다를 수 있습니다.</p>
<button type="button" id="show-map" th:unless="${#strings.isEmpty(mapKey)}">지도 보기</button>
<a th:href="${mapSearchUrl}" target="_blank" rel="noopener noreferrer">카카오맵에서 검색</a>
<p id="map-status" role="status" aria-live="polite"></p><div id="map-canvas" hidden aria-label="아파트 주소 지도"></div>
</section><script src="/js/detail-map.js" defer></script>
<section class="chart-card"><div class="section-heading"><h2>같은 면적의 거래 흐름</h2><span th:text="${trade.area+'㎡ · 최근 최대 12건'}"></span></div><div class="chart" role="img" aria-label="동일 면적 거래금액 막대 그래프. 아래 표에 상세 수치 제공."><div class="bar-column" th:each="t:${history}"><span class="bar-value" th:text="${t.priceLabel()}"></span><div class="bar" th:style="'height:'+${t.price*170/chartMax}+'px'"></div><span class="bar-date" th:text="${#temporals.format(t.dealDate,'yy.MM')}"></span></div></div><p class="small-note">왼쪽부터 최근 계약순 · 층과 개별 거래 조건은 다를 수 있어요.</p></section>
<div class="table-wrap"><table><thead><tr><th>계약일</th><th>거래금액</th><th>전용면적</th><th>층</th></tr></thead><tbody><tr th:each="t:${history}"><td th:text="${t.dealDate}"></td><td><strong th:text="${t.priceLabel()}"></strong></td><td th:text="${t.area+'㎡'}"></td><td th:text="${t.floor+'층'}"></td></tr></tbody></table></div></main><div th:replace="~{fragments :: footer}"></div><div id="toast" role="status" aria-live="polite"></div></body></html>
